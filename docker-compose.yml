services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: crm_db
      DB_USERNAME: crm_user
      DB_PASSWORD: crm_password
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
    expose:
      - "9000"
      - "8080"
    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan db:seed --class=AdminUserSeeder &&
        php artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction & 
        php-fpm
      "
    networks:
      - crm_network

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8001:80"
    networks:
      - crm_network

volumes:
  postgres_data:


networks:
  crm_network:
    driver: bridge
