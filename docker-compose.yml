services:
  postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_CONFIG: |
        shared_buffers = 256MB
        effective_cache_size = 768MB
        maintenance_work_mem = 64MB
        checkpoint_completion_target = 0.9
        wal_buffers = 16MB
        default_statistics_target = 100
        random_page_cost = 1.1
        effective_io_concurrency = 200
        work_mem = 16MB
        huge_pages = off
        min_wal_size = 1GB
        max_wal_size = 4GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - crm_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: crm_db
      DB_USERNAME: crm_user
      DB_PASSWORD: crm_password
      PHP_FPM_PM: dynamic
      PHP_FPM_PM_MAX_CHILDREN: 50
      PHP_FPM_PM_START_SERVERS: 10
      PHP_FPM_PM_MIN_SPARE_SERVERS: 5
      PHP_FPM_PM_MAX_SPARE_SERVERS: 20
      PHP_FPM_PM_MAX_REQUESTS: 500
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 300
    expose:
      - "9000"
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan db:seed --class=AdminUserSeeder &&
        php-fpm -F -c /usr/local/etc/php-fpm.conf.d/www.conf
      "
    networks:
      - crm_network

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_cache:/var/cache/nginx
    ports:
      - "8001:80"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - crm_network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_reverb
    restart: unless-stopped
    depends_on:
      - backend
      - postgres
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: crm_db
      DB_USERNAME: crm_user
      DB_PASSWORD: crm_password
      PHP_MEMORY_LIMIT: 256M
    command: php artisan reverb:start
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - crm_network

volumes:
  postgres_data:
  nginx_cache:


networks:
  crm_network:
    driver: bridge
